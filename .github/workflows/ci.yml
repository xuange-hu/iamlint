name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # pytest is a dev tool, not a dependency: the zero-dependency promise
          # is about what `pip install iamlint` drags in.
          python -m pip install pytest
          python -c "import iamlint, sys; print('imported with deps:', [m for m in sys.modules if m in ('yaml','click','rich','requests','cryptography')])"
          python -c "
          import subprocess, sys
          mods = subprocess.run([sys.executable, '-c', 'import iamlint.cli'], capture_output=True)
          assert mods.returncode == 0, mods.stderr.decode()
          print('cli imports cleanly with no third-party packages installed')
          "

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke
        run: |
          iamlint --version
          iamlint rules | head -3
          iamlint demo --json > /tmp/demo.json
          python -c "import json; d=json.load(open('/tmp/demo.json')); print('demo findings:', len(d['findings']), 'grade', d['grade'])"
          iamlint lab --out /tmp/iam-lab
          # The lab is *supposed* to have findings, so this scan is a smoke test
          # of the exit-code path, not a gate: --fail-on none keeps it at 0.
          iamlint /tmp/iam-lab --min-severity high --compact --fail-on none
          iamlint /tmp/iam-lab --min-severity high --quiet || echo "exit 1 on findings, as designed"

      - name: MCP manifest check
        run: |
          python -m pip install ".[mcp]"
          python -c "
          from iamlint.mcp_server import build_server
          import asyncio
          s = build_server()
          async def go():
              tools = await s.list_tools()
              return sorted(t.name for t in tools)
          names = asyncio.run(go())
          expected = sorted(['iamlint_scan_text','iamlint_scan_path','iamlint_privilege_paths','iamlint_rules','iamlint_explain','iamlint_demo'])
          assert names == expected, names
          print('mcp tools:', names)
          "

  fresh-clone:
    # Every other job installs the package before testing, which is exactly why
    # a broken `pytest` on a bare clone goes unnoticed: the src/ layout needs
    # the root conftest.py to put src/ on sys.path. Install pytest and nothing
    # else, then let the suite bootstrap itself.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: pytest only, no package install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: A bare clone can run its own tests
        run: python -m pytest -q

      - name: And the CLI still works from src
        run: python -c "import sys; sys.path.insert(0, 'src'); import iamlint.cli; print('cli ok')"

  demo-contract:
    # The demo is the first thing a visitor runs, and it has to work with no
    # network and no AWS account. Unlike the TLS sibling of this project there
    # is no OpenSSL here: every rule is reachable from checked-in text, so the
    # contract is asserted absolutely - all 49, not "at least most".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: The demo reaches every rule
        run: |
          iamlint demo > /tmp/report.txt
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from iamlint.demo import missing_rules, run_demo
          missing = missing_rules(run_demo())
          if missing:
              print("::error::rules the demo no longer reaches:", ", ".join(missing))
              sys.exit(1)
          print("every rule is present in the demo report")
          PY
      - name: The demo needs no network
        run: grep -q "no AWS call" /tmp/report.txt

  badge-check:
    # The README test count is the first number a visitor reads. It is checked
    # here, where the optional deps are installed and every module collects,
    # rather than inside the matrix: self-skipping modules make the count
    # environment-dependent and produce a week of false alarms.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install with optional test deps
        run: |
          python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest collection
        run: |
          actual=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} claimed=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::error::README badge says $claimed but pytest collects $actual"
            exit 1
          fi
