[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iamlint"
version = "0.1.0"
description = "AWS IAM policy audit with the line, column and bytes that prove each finding - 49 rules, a second pass that reads statements together, a lab, SARIF. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# The core is dependency-free on purpose: this runs on a laptop with no pip
# index, in a slim container, and inside a CI job that installs nothing.
dependencies = []
keywords = [
  "iam",
  "aws",
  "policy",
  "security",
  "cloud-security",
  "privilege-escalation",
  "confused-deputy",
  "least-privilege",
  "sarif",
  "mcp",
  "model-context-protocol",
  "devsecops",
  "zero-dependencies",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved it; this server targets 1.x.
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/iamlint"
Repository = "https://github.com/xuange-hu/iamlint"
Issues = "https://github.com/xuange-hu/iamlint/issues"

[project.scripts]
iamlint = "iamlint.cli:main"
iamlint-mcp = "iamlint.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iamlint = ["data/lab/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "PL",
  "RUF",
]
# PLR0911/0912/0915: a rule dispatcher and a CLI are allowed to be wide;
# splitting them makes them harder to read, not easier.
# PLC0415: the MCP facade imports the SDK lazily on purpose.
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "RUF001", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "PLR2004", "PLW2901"]
"src/iamlint/demo.py" = ["E501"]
"src/iamlint/lab.py" = ["E501"]
